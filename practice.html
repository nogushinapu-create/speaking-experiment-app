<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Practice Experiment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 820px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    .box {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ccc;
    }

    .error {
      border-color: red;
      color: red;
    }

    .hidden {
      display: none;
    }
    #outputStimulus {
  width: 100%;
  max-height: 460px;
  object-fit: contain;
  border: 1px solid #ccc;
  margin-top: 20px;
}

#outputTimer {
  font-size: 56px;
  font-weight: bold;
  text-align: center;
  margin: 24px 0;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.check-row {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.check-row input {
  width: auto;
  margin-top: 0;
}
    
  </style>
</head>

<body>
  <h1>Practice Experiment</h1>

  <div id="loginArea">
    <p>SubjectIDを入力してください。</p>
    <input type="text" id="subjectId" placeholder="例：1001 / 2001 / 3001">
    <button onclick="loadParticipant()">開始</button>
  </div>

  <div id="message" class="box hidden"></div>

  <div id="participantArea" class="box hidden">
    <h2>Participant Information</h2>
    <p id="participantInfo"></p>
    <button onclick="startPractice()">Practiceを開始する</button>
  </div>

  <div id="conditionArea" class="box hidden">
    <h2 id="conditionTitle"></h2>
    <p id="conditionDescription"></p>
  </div>

  <div id="outputPracticeArea" class="box hidden">
  <h2>Output-only Practice</h2>

  <p id="outputTrialInfo"></p>

  <img id="outputStimulus" src="stimulus-output.png" alt="stimulus image">

  <div id="outputTimer">--</div>

  <button id="outputStartButton" onclick="startOutputPreparation()">準備を開始する</button>
  <button id="outputNextButton" class="hidden" onclick="nextOutputTrial()" disabled>次の試行へ</button>

  <div id="outputDownloadArea" class="box hidden">
    <p>録音が完了しました。以下から保存してください。</p>

    <audio id="outputAudioPlayback" controls style="width:100%;"></audio>

    <br><br>

    <a id="outputDownloadLink">録音ファイルをダウンロード</a>

    <div class="check-row">
      <input type="checkbox" id="outputDownloadConfirmed" onchange="handleOutputDownloadConfirmation()">
      <label for="outputDownloadConfirmed">録音ファイルを保存しました</label>
    </div>

    <p style="font-size: 14px;">
      ※ファイルを保存した後、チェックを入れると次の試行へ進めます。
    </p>
  </div>
</div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxrlaa8aKg1nTfCVUquFtGszDyyF6TM53oel1w5MXVf3kIl5akfP9JyUA1qKmfv26gK/exec';

    let participant = null;

    async function loadParticipant() {
      const subjectId = document.getElementById('subjectId').value.trim();

      if (!subjectId) {
        showMessage('SubjectIDを入力してください。', true);
        return;
      }

      showMessage('参加者情報を取得しています...', false);

      try {
        const url =
          `${API_URL}?action=getParticipant&subjectId=${encodeURIComponent(subjectId)}`;

        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
          showMessage(`Error: ${data.error}`, true);
          return;
        }

        participant = data;

        document.getElementById('loginArea').classList.add('hidden');
        document.getElementById('message').classList.add('hidden');
        document.getElementById('participantArea').classList.remove('hidden');

        document.getElementById('participantInfo').innerHTML =
          `SubjectID: ${participant.SubjectID}<br>
           Condition: ${participant.Condition}<br>
           PreTask: ${participant.PreTask}<br>
           PostTask: ${participant.PostTask}<br>
           PracticeStatus: ${participant.PracticeStatus || ''}`;

      } catch (error) {
        showMessage(
          `参加者情報の取得に失敗しました。<br>
           Error: ${error.message}`,
          true
        );
      }
    }

    function startPractice() {
      document.getElementById('participantArea').classList.add('hidden');
      document.getElementById('conditionArea').classList.remove('hidden');

      const condition = participant.Condition;

      if (condition === 'Output_only') {
        showOutputOnlyIntro();
      } else if (condition === 'Input_only') {
        showInputOnlyIntro();
      } else if (condition === 'Input+output') {
        showInputOutputIntro();
      } else {
        showMessage(`未定義のConditionです: ${condition}`, true);
      }
    }

    function showOutputOnlyIntro() {
  document.getElementById('conditionTitle').textContent = 'Output-only Practice';
  document.getElementById('conditionDescription').innerHTML =
    `この条件では、イラストを見て、準備時間の後に英語で話します。<br><br>
     準備ができたら、下のボタンからTrial 1を開始してください。`;

  document.getElementById('outputPracticeArea').classList.remove('hidden');
  renderOutputTrial();
}
    function showInputOnlyIntro() {
      document.getElementById('conditionTitle').textContent = 'Input-only Practice';
      document.getElementById('conditionDescription').innerHTML =
        `この条件では、モデル音声を複数回聞いた後、準備時間を取り、最後に英語で話します。<br><br>
         次の段階で、音声再生機能を実装します。`;
    }

    function showInputOutputIntro() {
      document.getElementById('conditionTitle').textContent = 'Input+output Practice';
      document.getElementById('conditionDescription').innerHTML =
        `この条件では、準備、発話、モデル音声の聴取を組み合わせて練習します。<br><br>
         次の段階で、発話録音と音声再生を組み合わせます。`;
    }

    let outputTrial = 1;
const outputTotalTrials = 6;
const outputPreparationDuration = 60;

const outputSpeakingDurations = {
  1: 120,
  2: 120,
  3: 90,
  4: 90,
  5: 90,
  6: 90
};

let outputMediaRecorder;
let outputAudioChunks = [];
let outputCountdownInterval;

function renderOutputTrial() {
  const speakingDuration = outputSpeakingDurations[outputTrial];

  document.getElementById('outputTrialInfo').innerHTML =
    `Trial ${outputTrial} / ${outputTotalTrials}<br>
     準備時間：${outputPreparationDuration}秒<br>
     発話時間：${speakingDuration}秒`;

  document.getElementById('outputTimer').textContent = outputPreparationDuration;
  document.getElementById('outputStartButton').classList.remove('hidden');
  document.getElementById('outputNextButton').classList.add('hidden');
  document.getElementById('outputNextButton').disabled = true;
  document.getElementById('outputDownloadArea').classList.add('hidden');
  document.getElementById('outputDownloadConfirmed').checked = false;
}

function startOutputPreparation() {
  document.getElementById('outputStartButton').classList.add('hidden');

  showMessage(
    `Trial ${outputTrial} の準備時間です。画像を見て、話す内容を考えてください。`,
    false
  );

  startOutputPreparationCountdown(outputPreparationDuration);
}

function startOutputPreparationCountdown(seconds) {
  let remaining = seconds;
  document.getElementById('outputTimer').textContent = remaining;

  clearInterval(outputCountdownInterval);

  outputCountdownInterval = setInterval(() => {
    remaining--;
    document.getElementById('outputTimer').textContent = remaining;

    if (remaining <= 0) {
      clearInterval(outputCountdownInterval);
      startOutputSpeaking();
    }
  }, 1000);
}

async function startOutputSpeaking() {
  const duration = outputSpeakingDurations[outputTrial];

  showMessage(`Trial ${outputTrial} の発話録音を開始しました。`, false);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    outputAudioChunks = [];
    outputMediaRecorder = new MediaRecorder(stream);

    outputMediaRecorder.ondataavailable = event => {
      if (event.data.size > 0) {
        outputAudioChunks.push(event.data);
      }
    };

    outputMediaRecorder.onstop = () => {
      stream.getTracks().forEach(track => track.stop());

      const audioBlob = new Blob(outputAudioChunks, { type: 'audio/webm' });
      const audioUrl = URL.createObjectURL(audioBlob);

      const fileName =
        `${participant.SubjectID}_practice_output_trial${outputTrial}_${duration}s.webm`;

      document.getElementById('outputAudioPlayback').src = audioUrl;

      const downloadLink = document.getElementById('outputDownloadLink');
      downloadLink.href = audioUrl;
      downloadLink.download = fileName;
      downloadLink.textContent = `${fileName} をダウンロード`;

      document.getElementById('outputDownloadArea').classList.remove('hidden');

      if (outputTrial < outputTotalTrials) {
        document.getElementById('outputNextButton').classList.remove('hidden');
        document.getElementById('outputNextButton').disabled = true;

        showMessage(
          `Trial ${outputTrial} の録音が完了しました。録音ファイルを保存し、確認チェックを入れてください。`,
          false
        );
      } else {
        document.getElementById('outputNextButton').classList.add('hidden');

        showMessage(
          'Trial 6 の録音が完了しました。録音ファイルを保存し、確認チェックを入れてください。',
          false
        );
      }
    };

    outputMediaRecorder.start();
    startOutputSpeakingCountdown(duration);

  } catch (error) {
    showMessage(
      `録音に失敗しました。<br>
       Error name: ${error.name}<br>
       Error message: ${error.message}`,
      true
    );

    document.getElementById('outputStartButton').classList.remove('hidden');
  }
}

function startOutputSpeakingCountdown(seconds) {
  let remaining = seconds;
  document.getElementById('outputTimer').textContent = remaining;

  clearInterval(outputCountdownInterval);

  outputCountdownInterval = setInterval(() => {
    remaining--;
    document.getElementById('outputTimer').textContent = remaining;

    if (remaining <= 0) {
      clearInterval(outputCountdownInterval);

      if (outputMediaRecorder && outputMediaRecorder.state !== 'inactive') {
        outputMediaRecorder.stop();
      }
    }
  }, 1000);
}

function handleOutputDownloadConfirmation() {
  const checked = document.getElementById('outputDownloadConfirmed').checked;

  if (!checked) {
    document.getElementById('outputNextButton').disabled = true;
    return;
  }

  if (outputTrial < outputTotalTrials) {
    document.getElementById('outputNextButton').disabled = false;

    showMessage(
      `Trial ${outputTrial} の保存確認が完了しました。次の試行へ進んでください。`,
      false
    );
  } else {
    showMessage(
      'Output-only Practice が完了しました。全ての録音ファイルが保存されていることを確認してください。',
      false
    );
  }
}

function nextOutputTrial() {
  outputTrial++;
  renderOutputTrial();
}
    
    function showMessage(message, isError) {
      const box = document.getElementById('message');
      box.style.display = 'block';
      box.className = isError ? 'box error' : 'box';
      box.innerHTML = message;
    }
  </script>
</body>
</html>

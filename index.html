<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Output-only Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 820px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    #stimulus {
      width: 100%;
      max-height: 460px;
      object-fit: contain;
      border: 1px solid #ccc;
      margin-top: 20px;
    }

    #timer {
      font-size: 56px;
      font-weight: bold;
      text-align: center;
      margin: 24px 0;
    }

    .box {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ccc;
    }

    .hidden {
      display: none;
    }

    .error {
      border-color: red;
      color: red;
    }
  </style>
</head>

<body>
  <h1>Speaking Experiment</h1>

  <div id="loginArea">
    <p>SubjectIDを入力してください。</p>
    <input type="text" id="subjectId" placeholder="例：2001">
    <button onclick="checkSubject()">開始</button>
  </div>

  <div id="message" class="box hidden"></div>

  <div id="practiceArea" class="hidden">
    <h2>Output-only Practice</h2>

    <p id="trialInfo"></p>

    <img id="stimulus" src="stimulus-output.png" alt="stimulus image">

    <div id="timer">--</div>

    <button id="startTrialButton" onclick="startPreparation()">準備を開始する</button>
    <button id="nextTrialButton" class="hidden" onclick="nextTrial()">次の試行へ</button>

    <div id="downloadArea" class="box hidden">
      <p>録音が完了しました。以下から保存してください。</p>
      <audio id="audioPlayback" controls style="width:100%;"></audio>
      <br><br>
      <a id="downloadLink">録音ファイルをダウンロード</a>
    </div>
  </div>

  <script>
    let subjectId = '';
    let currentTrial = 1;
    const totalTrials = 6;

    const preparationDuration = 60;

    const trialDurations = {
      1: 120,
      2: 120,
      3: 90,
      4: 90,
      5: 90,
      6: 90
    };

    let mediaRecorder;
    let audioChunks = [];
    let countdownInterval;

    function checkSubject() {
      subjectId = document.getElementById('subjectId').value.trim();

      if (!subjectId) {
        showMessage('SubjectIDを入力してください。', true);
        return;
      }

      const idNumber = Number(subjectId);

      if (idNumber < 2001 || idNumber > 2040) {
        showMessage(
          `このMVPでは Output-only 条件のみ実装しています。<br>
          Output-only は SubjectID 2001–2040 です。`,
          true
        );
        return;
      }

      document.getElementById('loginArea').classList.add('hidden');
      document.getElementById('message').classList.add('hidden');
      document.getElementById('practiceArea').classList.remove('hidden');

      renderTrial();
    }

    function renderTrial() {
      const speakingDuration = trialDurations[currentTrial];

      document.getElementById('trialInfo').innerHTML =
        `Trial ${currentTrial} / ${totalTrials}<br>
         準備時間：${preparationDuration}秒<br>
         発話時間：${speakingDuration}秒`;

      document.getElementById('timer').textContent = preparationDuration;
      document.getElementById('startTrialButton').textContent = '準備を開始する';
      document.getElementById('startTrialButton').classList.remove('hidden');
      document.getElementById('nextTrialButton').classList.add('hidden');
      document.getElementById('downloadArea').classList.add('hidden');
    }

    function startPreparation() {
      document.getElementById('startTrialButton').classList.add('hidden');

      showMessage(
        `Trial ${currentTrial} の準備時間です。画像を見て、話す内容を考えてください。`,
        false
      );

      startPreparationCountdown(preparationDuration);
    }

    function startPreparationCountdown(seconds) {
      let remaining = seconds;
      document.getElementById('timer').textContent = remaining;

      clearInterval(countdownInterval);

      countdownInterval = setInterval(() => {
        remaining--;
        document.getElementById('timer').textContent = remaining;

        if (remaining <= 0) {
          clearInterval(countdownInterval);
          startTrial();
        }
      }, 1000);
    }

    async function startTrial() {
      const duration = trialDurations[currentTrial];

      showMessage(
        `Trial ${currentTrial} の発話録音を開始しました。`,
        false
      );

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(track => track.stop());

          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const audioUrl = URL.createObjectURL(audioBlob);

          const fileName =
            `${subjectId}_practice_output_trial${currentTrial}_${duration}s.webm`;

          const audioPlayback = document.getElementById('audioPlayback');
          audioPlayback.src = audioUrl;

          const downloadLink = document.getElementById('downloadLink');
          downloadLink.href = audioUrl;
          downloadLink.download = fileName;
          downloadLink.textContent = `${fileName} をダウンロード`;

          document.getElementById('downloadArea').classList.remove('hidden');

          showMessage(`Trial ${currentTrial} の録音が完了しました。`, false);

          if (currentTrial < totalTrials) {
            document.getElementById('nextTrialButton').classList.remove('hidden');
          } else {
            showMessage(
              'Output-only Practice が完了しました。全ての録音ファイルを保存してください。',
              false
            );
          }
        };

        mediaRecorder.start();
        startSpeakingCountdown(duration);

      } catch (error) {
        showMessage(
          `録音に失敗しました。<br>
           Error name: ${error.name}<br>
           Error message: ${error.message}`,
          true
        );

        document.getElementById('startTrialButton').classList.remove('hidden');
      }
    }

    function startSpeakingCountdown(seconds) {
      let remaining = seconds;
      document.getElementById('timer').textContent = remaining;

      clearInterval(countdownInterval);

      countdownInterval = setInterval(() => {
        remaining--;
        document.getElementById('timer').textContent = remaining;

        if (remaining <= 0) {
          clearInterval(countdownInterval);

          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        }
      }, 1000);
    }

    function nextTrial() {
      currentTrial++;
      renderTrial();
    }

    function showMessage(message, isError) {
      const box = document.getElementById('message');
      box.style.display = 'block';
      box.className = isError ? 'box error' : 'box';
      box.innerHTML = message;
    }
  </script>
</body>
</html>
